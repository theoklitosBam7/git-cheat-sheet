    <!-- Edges -->
    <path d="M20 18 L20 28" stroke="#79c0ff" stroke-width="4"/>
    <path d="M20 28 L34 28" stroke="#79c0ff" stroke-width="4"/>
    <path d="M34 28 L34 40" stroke="#f78166" stroke-width="4"/>
    <path d="M20 28 L12 40" stroke="#f78166" stroke-width="4"/>

    <!-- Nodes -->
    <circle cx="20" cy="18" r="7" stroke="#79c0ff" stroke-width="4"/>
    <circle cx="34" cy="28" r="7" stroke="#79c0ff" stroke-width="4"/>
    <circle cx="34" cy="40" r="7" stroke="#f78166" stroke-width="4"/>
    <circle cx="12" cy="40" r="7" stroke="#f78166" stroke-width="4"/>
  </g>
</svg>
